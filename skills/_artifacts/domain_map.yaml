# domain_map.yaml
# Library: @powerboard/dev-router
# Version: 0.3.4
# Date: 2026-09-15
# Status: reviewed

library:
  name: '@powerboard/dev-router'
  version: '0.3.4'
  repository: 'https://github.com/shansmith01/wrangle-webhooks'
  description: 'Shared Cloudflare ingress router client for cloud development environments'
  primary_framework: 'framework-agnostic'

domains:
  - name: Client connection
    slug: client-connection
    description: Registering a cloud environment as a reverse-tunnel or public-target subscriber
  - name: Shared Worker operations
    slug: worker-operations
    description: Deploying and operating the single shared ingress Worker
  - name: Ingress contract
    slug: ingress-contract
    description: What public callers and subscriber apps observe on the wire

skills:
  - name: connect
    slug: connect
    domain: client-connection
    description: Connect a remote cloud environment with the CLI or DevRouterClient
    type: core
    covers:
      - DevRouterClient
      - npx dev-router connect
      - detectPublicDevUrl
      - validateTargetBaseUrl
      - routeId
    tasks:
      - Install @powerboard/dev-router and run the sidecar
      - Expose a Cloudflare-reachable HTTPS origin in remote clouds
      - Override detected public URLs
      - Connect programmatically and disconnect on shutdown
    failure_modes:
      - mistake: Treat client as request runtime
        mechanism: The npm client only registers and heartbeats; the Worker fans out HTTP.
        wrong_pattern: |
          import { DevRouterClient } from "@powerboard/dev-router";
        correct_pattern: |
          npx dev-router connect
        source: skills/connect/connect.md
        priority: HIGH
        status: active
        version_context: '0.1.0'
        skills: ['connect']
      - mistake: Pass localhost, http, or IDE-only port-forward targets
        mechanism: validateTargetBaseUrl requires absolute https without credentials or fragments. The Worker fetch()es the target from Cloudflare.
        wrong_pattern: |
          await client.connect({ targetBaseUrl: "http://localhost:3000" });
        correct_pattern: |
          await client.connect({ targetBaseUrl: "https://abc123.trycloudflare.com" });
        source: src/target-base-url.ts
        priority: HIGH
        status: active
        version_context: '0.1.0'
        skills: ['connect']
      - mistake: npx public package name without install
        mechanism: npx looks up npm package dev-router when the binary is not installed locally.
        wrong_pattern: |
          npx dev-router connect
        correct_pattern: |
          npm install -D @powerboard/dev-router
          npx dev-router connect
        source: skills/connect/connect.md
        priority: HIGH
        status: active
        version_context: '0.1.0'
        skills: ['connect']
  - name: deploy
    slug: deploy
    domain: worker-operations
    description: Deploy and configure the shared Cloudflare Worker
    type: lifecycle
    covers:
      - wrangler deploy
      - DEV_ROUTER_SECRET
      - wrangler types
      - /dashboard
    tasks:
      - Deploy the Worker and set the management secret
      - Run wrangler dev locally
    failure_modes:
      - mistake: Hardcode the management secret
        mechanism: Secrets in wrangler vars or source leak through git and the dashboard config.
        wrong_pattern: |
          { "vars": { "DEV_ROUTER_SECRET": "super-secret" } }
        correct_pattern: |
          npx wrangler secret put DEV_ROUTER_SECRET
        source: skills/deploy/deploy.md
        priority: CRITICAL
        status: active
        version_context: '0.1.0'
        skills: ['deploy']
      - mistake: Hand-write Env after binding changes
        mechanism: Env must come from wrangler types against wrangler.jsonc.
        wrong_pattern: |
          interface Env { ROUTE: DurableObjectNamespace }
        correct_pattern: |
          npx wrangler types
        source: wrangler.jsonc
        priority: HIGH
        status: active
        version_context: '0.1.0'
        skills: ['deploy']
      - mistake: Gate /dashboard with the management bearer token
        mechanism: /dashboard uses a Path=/dashboard session cookie after posting DEV_ROUTER_DASHBOARD_PASSWORD to /dashboard/login; /_router/* uses the management bearer.
        wrong_pattern: |
          fetch("/dashboard", { headers: { Authorization: "Bearer ..." } })
        correct_pattern: |
          POST /dashboard/login then GET /dashboard with the session cookie
        source: src/worker.ts
        priority: HIGH
        status: active
        version_context: '0.3.4'
        skills: ['deploy']
  - name: forwarding
    slug: forwarding
    domain: ingress-contract
    description: Implement the subscriber app against the public request contract
    type: core
    covers:
      - 202 Accepted
      - route_not_found
      - X-Dev-Router-* headers
      - fan-out timeout
    tasks:
      - Map public prefixed URLs to the app path
      - Handle 202 vs subscriber status
    failure_modes:
      - mistake: Expect subscriber status on the public response
        mechanism: handlePublic returns 202 after waitUntil fan-out is accepted.
        wrong_pattern: |
          // public 202 means the app returned 200
        correct_pattern: |
          // inspect the subscriber app; public hop is 202
        source: src/worker.ts
        priority: HIGH
        status: active
        version_context: '0.1.0'
        skills: ['forwarding']
      - mistake: Treat routeId as a secret
        mechanism: routeId is a public path prefix; management uses the bearer secret.
        wrong_pattern: |
          await client.connect({ routeId: "unguessable-secret" })
        correct_pattern: |
          await client.connect({ routeId: "my-web-app" })
        source: skills/forwarding/forwarding.md
        priority: HIGH
        status: active
        version_context: '0.1.0'
        skills: ['forwarding']
      - mistake: Point providers at the tunnel URL instead of the router
        mechanism: Public callers hit the Worker; Cloudflare fetch()es targetBaseUrl. Unreachable targets still yield 202 to the provider.
        wrong_pattern: |
          // register https://127.0.0.1:3000/oauth/callback with the provider
        correct_pattern: |
          // provider URL is https://dev-webhooks.example.com/my-web-app/oauth/callback
        source: src/worker.ts
        priority: HIGH
        status: active
        version_context: '0.1.0'
        skills: ['forwarding', 'connect']
      - mistake: Follow redirects at the router hop
        mechanism: deliverToSubscriber sets redirect manual and a 10s timeout.
        wrong_pattern: |
          // expect the router to chase 302 from the target
        correct_pattern: |
          // subscriber should respond without requiring redirect following
        source: src/forward.ts
        priority: MEDIUM
        status: active
        version_context: '0.1.0'
        skills: ['forwarding']

tensions:
  - name: Public prefix vs management auth
    skills: ['connect', 'forwarding']
    description: routeId is visible in URLs while management uses a bearer secret
    implication: Agents may treat --route as authentication or skip X-Dev-Router-Secret checks

cross_references:
  - from: connect
    to: forwarding
    reason: After connect, the app must implement the forwarding contract
  - from: deploy
    to: connect
    reason: Clients need the deployed origin and secret

gaps:
  - skill: connect
    question: Public npm package name once the registry publish exists
    context: Install path is npm @powerboard/dev-router; unscoped npx dev-router still looks up a different package
    status: closed
